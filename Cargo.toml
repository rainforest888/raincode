[workspace]
resolver = "2"
members = [
    "crates/rc-core",
    "crates/rc-pro",
    "crates/rc-profile",
    "crates/rc-gateway",
    "crates/rc-tool",
    "crates/rc-sandbox",
    "crates/rc-state",
    "crates/rc-router",
    "crates/rc-skill",
    "crates/rc-evolve",
    "crates/rc-mcp",
    "crates/rc-net",
    "crates/rc-proto",
    "crates/rc-cli",
    "crates/rc-orchestrate",
    "tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Raincode Contributors"]
repository = "https://github.com/raincode/raincode"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = { version = "0.7", features = ["http1", "json"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
parking_lot = "0.12"
once_cell = "1"
regex = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
unicode-width = "0.1"
url = "2"
base64 = "0.22"
bytes = "1"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
glob = "0.3"
tempfile = "3"
filetime = "0.2"


# Internal workspace crates.
rc-core = { path = "crates/rc-core" }
rc-pro = { path = "crates/rc-pro" }
rc-profile = { path = "crates/rc-profile" }
rc-gateway = { path = "crates/rc-gateway" }
rc-tool = { path = "crates/rc-tool" }
rc-sandbox = { path = "crates/rc-sandbox" }
rc-state = { path = "crates/rc-state" }
rc-router = { path = "crates/rc-router" }
rc-skill = { path = "crates/rc-skill" }
rc-evolve = { path = "crates/rc-evolve" }
rc-mcp = { path = "crates/rc-mcp" }
rc-net = { path = "crates/rc-net" }
rc-proto = { path = "crates/rc-proto" }
rc-cli = { path = "crates/rc-cli" }
rc-orchestrate = { path = "crates/rc-orchestrate" }
raincode-tui = { path = "tui" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true


