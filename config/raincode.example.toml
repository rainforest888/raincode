# Raincode v0.1 example configuration.
# Copy to ~/.raincode/config.toml and edit.

[core]
workspace = "."
max_turns = 24
max_history_bytes = 262144      # 0 disables context compaction
approval_mode = "ask"          # ask | auto | deny
agent = "coding"               # coding | architect | researcher | custom
# Platform sandbox is a v0.1 trait; "none" (default) uses direct execution.
platform = "none"

[hooks]
# session_start = ["echo session started"]
# session_end = ["echo session ended"]
# Non-zero exit or `deny` / {"decision":"deny"} blocks the tool.
# pre_tool = ["node .raincode/hooks/pre_tool.mjs"]
# post_tool = ["node .raincode/hooks/post_tool.mjs"]

[model]
profile = "default"            # active provider profile id (see [profiles])
embedding_profile = ""         # optional; fallback to model profile for embeddings

[evolve]
enabled = true
auto_approve = true            # auto-write evolved skills + audit log
min_experiences = 3
similarity_threshold = 0.78
daemon_interval_minutes = 15
daemon_lock = "~/.raincode/.daemon.lock"

[entropy]
enabled = true
# "single": one API/profile drives understand -> plan -> execute -> review.
# "multi": plan_profile / execute_profile / review_profile can differ.
mode = "single"
plan_profile = ""
execute_profile = ""
review_profile = ""
plan_max_rounds = 6
plan_max_questions = 5
review_max_rounds = 3
max_cycles = 3

[skills]
seed_on_first_run = true
top_k = 8
dir = "~/.raincode/skills"

[sandbox.commands]
allow = ["git status", "git diff", "cargo test", "pnpm test"]
deny = ["rm -rf", "format", "del /s"]

[sandbox.network]
allow_hosts = ["api.github.com", "raw.githubusercontent.com", "crates.io"]
deny_hosts = []
default = "deny"

[mcp.servers.filesystem]
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "."]

[gateway]
enabled = false
listen = "127.0.0.1:8787"

# Quickest setup (recommended): only pick a vendor and paste a key.
# Keys are stored in ~/.raincode/keys/<id>.key with user-only permissions,
# never written back into profiles.toml.
#   raincode model add my-openai --provider openai --api-key sk-...
#   raincode model use my-openai
# Or use environment variables and no key file at all:
#   raincode model add my-anthropic --provider anthropic --api-key-env ANTHROPIC_API_KEY
#
# Catalog ids: openai, anthropic, deepseek, kimi, qwen, gemini, zhipu,
# groq, openrouter, ollama.

[profiles.default]
kind = "openai"                # openai | anthropic | openai-compat | ollama | mock
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"

[profiles.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"
model = "claude-sonnet-4-5"
api_key_env = "ANTHROPIC_API_KEY"

[profiles.ollama-local]
kind = "ollama"
base_url = "http://127.0.0.1:11434"
model = "qwen3"
embedding_model = "nomic-embed-text"

[profiles.mock]
kind = "mock"
model = "mock-1"
