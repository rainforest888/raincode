[package]
name = "rc-router"
version = "0.1.0"
edition = "2021"

[dependencies]
rc-core = { path = "../rc-core" }
rc-proto = { path = "../rc-proto" }
rc-state = { path = "../rc-state" }
rc-pro = { path = "../rc-pro" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
futures = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
rc-sandbox = { path = "../rc-sandbox" }
rc-skill = { path = "../rc-skill" }
tempfile = "3"
